backend:
  name: github
  repo: Ysflagh/global-deals
  branch: main

media_folder: uploads
public_folder: /uploads

collections:
  - name: offers
    label: Offers
    files:
      - name: offers
        label: All offers
        file: data/offers.json
        fields:
          - label: Offers
            name: offers
            widget: list
            summary: "{{fields.category}} - {{fields.title}}"
            fields:
              - { label: Category, name: category, widget: select, options: [
                  { label: Electronics, value: electronics },
                  { label: Clothing & Fashion, value: fashion },
                  { label: Accessories, value: accessories },
                  { label: Jewelry, value: jewelry },
                  { label: Home & Kitchen, value: home },
                  { label: Beauty & Health, value: beauty },
                  { label: Sports & Outdoor, value: sports },
                  { label: Toys & Kids, value: toys } ] }
              - { label: Title, name: title, widget: string }
              - { label: Photo, name: image, widget: image, required: false }
              - { label: Price, name: price, widget: string, required: false }
              - { label: Old price, name: oldPrice, widget: string, required: false }
              - { label: Coupon code, name: coupon, widget: string, required: false }
              - { label: Badge (ex 20% OFF), name: badge, widget: string, required: false }
              - { label: Valid until (optional), name: expires, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
              - { label: Affiliate link, name: link, widget: string }

  - name: reviews
    label: Reviews
    files:
      - name: reviews
        label: All reviews
        file: data/reviews.json
        fields:
          - label: Reviews
            name: reviews
            widget: list
            summary: "{{fields.name}} - {{fields.rating}} stars"
            fields:
              - { label: First name, name: name, widget: string }
              - { label: Rating (1 to 5), name: rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { label: Review, name: text, widget: text }
              - { label: Date (ex Oct 2026), name: date, widget: string, required: false }
